stages:
  data_ingestion:
    cmd: python src/ChestCancer/pipeline/stage_01_data_ingestion.py
    deps:
      - src/ChestCancer/pipeline/stage_01_data_ingestion.py
      - config/config.yaml
    outs:
      - artifacts/data_ingestion/data.zip

  data_preparation:
    cmd: python src/ChestCancer/pipeline/stage_02_data_preparation.py
    deps:
      - src/ChestCancer/pipeline/stage_02_data_preparation.py
      - config/config.yaml
      - artifacts/data_ingestion/data.zip
    params:
      - data_preparation.SPLITS
    outs:
      - artifacts/data_preparation/prepared

  prepare_base_model:
    cmd: python src/ChestCancer/pipeline/stage_03_baseline_model.py
    deps:
      - src/ChestCancer/pipeline/stage_03_baseline_model.py
      - config/config.yaml
    params:
      - baseline_model.IMAGE_SIZE
      - baseline_model.INCLUDE_TOP
      - baseline_model.CLASSES
      - baseline_model.WEIGHTS
      - baseline_model.LEARNING_RATE
      - baseline_model.HEAD_TYPE
      - baseline_model.DROPOUT_RATE
      - baseline_model.UNFREEZE_FROM_LAYER
    outs:
      - artifacts/base_line_model/base_model.h5
      - artifacts/base_line_model/updated_base_model.h5

  model_trainer:
    cmd: python src/ChestCancer/pipeline/stage_04_model_trainer.py
    deps:
      - src/ChestCancer/pipeline/stage_04_model_trainer.py
      - config/config.yaml
      - artifacts/data_preparation/prepared
      - artifacts/base_line_model/updated_base_model.h5
    params:
      - baseline_model.IMAGE_SIZE
      - baseline_model.EPOCHS
      - baseline_model.BATCH_SIZE
      - baseline_model.AUGMENTATION
      - baseline_model.LEARNING_RATE
      - baseline_model.PATIENCE
    outs:
      - artifacts/training/model.h5

  evaluation:
    cmd: python src/ChestCancer/pipeline/stage_05_evaluation.py
    deps:
      - src/ChestCancer/pipeline/stage_05_evaluation.py
      - config/config.yaml
      - artifacts/data_preparation/prepared
      - artifacts/training/model.h5
    params:
      - baseline_model.IMAGE_SIZE
      - baseline_model.BATCH_SIZE
    metrics:
      - scores.json:
          cache: false

